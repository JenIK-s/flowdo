name: build

on:
  push:
    branches: [main]
    tags: ["v*"]          # git tag v3.0.0 && git push --tags → релиз с установщиком
  pull_request:
  workflow_dispatch:      # ручной запуск: Actions → build → Run workflow

permissions:
  contents: write         # нужно для публикации релиза

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Проверка типов
        run: npm run check
      - name: Тесты фронтенда
        run: npm test
      - name: Сборка фронтенда
        run: npm run build
      - name: Тесты Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Сборка FlowDo (exe + установщик)
        run: npx tauri build

      - name: Подготовка файлов
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/flowdo.exe out/FlowDo.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FlowDo-windows
          path: out/*.exe

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
