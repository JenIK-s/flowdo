name: build-exe

on:
  workflow_dispatch:          # ручной запуск: Actions → build-exe → Run workflow
  push:
    branches: [main]
    tags: ["v*"]              # git tag v2.0.0 && git push --tags → релиз с exe

permissions:
  contents: write             # нужно для публикации релиза

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build FlowDo.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name FlowDo
          --add-data "app/static;app/static"
          --collect-submodules uvicorn --collect-submodules webview
          run.py

      - uses: actions/upload-artifact@v4
        with:
          name: FlowDo-windows
          path: dist/FlowDo.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlowDo.exe
